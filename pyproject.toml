[project]
name = "gridmend"
version = "0.1.0"
description = "Broken ring photo + voice -> checked ring CAD"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "openai>=1.40",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "cadquery>=2.4",
  "trimesh>=4.4",
  "rtree>=1.4.1",
  "langchain-openai==1.6.2",
  "langchain-core==1.6.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests", "cad", "engine", "api"]
pythonpath = ["."]

[tool.uv]
package = false
